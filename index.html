      { id: 92, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "Which expression is logically equivalent to ¬(P ∨ Q)?", options: ["¬P ∨ ¬Q", "P ∧ Q", "¬P ∧ ¬Q", "P ∨ Q"], correct: 2 },
      { id: 93, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "How many onto functions are there from a 3-element set to a 2-element set?", options: ["2", "4", "6", "8"], correct: 2 },
      { id: 94, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "How many one-to-one functions are there from a 3-element set to a 5-element set?", options: ["10", "20", "60", "125"], correct: 2 },
      { id: 95, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "How many distinct arrangements can be made from the letters of MISSISSIPPI?", options: ["34,650", "23,500", "10,000", "45,054"], correct: 0 },
      { id: 96, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "In a class of 80 students, 45 study Math, 38 study CS, and 20 study both. How many study neither?", options: ["13", "17", "23", "27"], correct: 1 },
      { id: 97, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "Six distinct people are arranged in a line. In how many arrangements must Alice and Bob stand together?", options: ["120", "240", "360", "720"], correct: 1 },
      { id: 98, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "A bag contains 5 red balls and 3 blue balls. Two balls are drawn randomly without replacement. What is the probability that both balls are red?", options: ["5/16", "5/14", "25/64", "1/2"], correct: 1 },
      { id: 99, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "Let f(x) = 2x + 1 and g(x) = x². Find (g ∘ f)(3).", options: ["25", "36", "49", "64"], correct: 2 },
      { id: 100, round: "Round 5: Very Hard", badgeClass: "bg-purple-600 text-purple-50", q: "What is an ordered pair?", options: ["A group without order", "A pair where position matters", "A set with no elements", "A factorial"], correct: 1 }
    ];

    let currentRoundIndex = null;
    let currentQuestionIdx = 0;
    let roundQuestions = [];
    let score = 0;
    let timerInterval = null;
    let timeLeft = 30;

    function renderHub() {
      clearInterval(timerInterval);
      document.getElementById('round-indicator').innerText = "Main Hub";
      document.getElementById('timer-display').innerText = "--";
      
      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="text-center mb-8">
          <h1 class="arcade-font text-4xl md:text-5xl font-bold text-white mb-3">DISCRETE MATH <span class="text-cyan-400">GAME SHOW</span></h1>
          <p class="text-slate-400 text-lg">Select a round below to start playing through all 100 questions!</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
          <button onclick="startRound(0, 20, 'Round 1: Very Easy')" class="bg-emerald-700 hover:bg-emerald-600 border border-emerald-500/50 p-6 rounded-2xl text-left transition transform hover:-translate-y-1 shadow-lg">
            <div class="arcade-font text-2xl text-white mb-2">ROUND 1</div>
            <div class="text-emerald-200 text-sm font-semibold">Very Easy (Q1-20)</div>
          </button>
          <button onclick="startRound(20, 40, 'Round 2: Easy')" class="bg-blue-700 hover:bg-blue-600 border border-blue-500/50 p-6 rounded-2xl text-left transition transform hover:-translate-y-1 shadow-lg">
            <div class="arcade-font text-2xl text-white mb-2">ROUND 2</div>
            <div class="text-blue-200 text-sm font-semibold">Easy (Q21-40)</div>
          </button>
          <button onclick="startRound(40, 65, 'Round 3: Normal')" class="bg-amber-700 hover:bg-amber-600 border border-amber-500/50 p-6 rounded-2xl text-left transition transform hover:-translate-y-1 shadow-lg">
            <div class="arcade-font text-2xl text-white mb-2">ROUND 3</div>
            <div class="text-amber-200 text-sm font-semibold">Normal (Q41-65)</div>
          </button>
          <button onclick="startRound(65, 85, 'Round 4: Hard')" class="bg-red-700 hover:bg-red-600 border border-red-500/50 p-6 rounded-2xl text-left transition transform hover:-translate-y-1 shadow-lg">
            <div class="arcade-font text-2xl text-white mb-2">ROUND 4</div>
            <div class="text-red-200 text-sm font-semibold">Hard (Q66-85)</div>
          </button>
          <button onclick="startRound(85, 100, 'Round 5: Very Hard')" class="bg-purple-700 hover:bg-purple-600 border border-purple-500/50 p-6 rounded-2xl text-left transition transform hover:-translate-y-1 shadow-lg">
            <div class="arcade-font text-2xl text-white mb-2">ROUND 5</div>
            <div class="text-purple-200 text-sm font-semibold">Very Hard (Q86-100)</div>
          </button>
        </div>
      `;
    }

    function startRound(startIndex, endIndex, roundName) {
      roundQuestions = questionsData.slice(startIndex, endIndex);
      currentQuestionIdx = 0;
      document.getElementById('round-indicator').innerText = roundName;
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timerInterval);
      if (currentQuestionIdx >= roundQuestions.length) {
        showRoundComplete();
        return;
      }

      timeLeft = 30;
      startTimer();

      const q = roundQuestions[currentQuestionIdx];
      const container = document.getElementById('app-container');
      
      const letters = ['A', 'B', 'C', 'D'];
      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += `
          <button onclick="handleAnswer(${idx})" class="bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-cyan-400 p-4 rounded-xl flex items-center gap-4 text-left font-semibold text-lg transition transform hover:-translate-y-0.5">
            <span class="arcade-font bg-cyan-400 text-slate-950 w-9 h-9 rounded-lg flex items-center justify-center font-bold text-lg">${letters[idx]}</span>
            <span class="text-slate-100">${opt}</span>
          </button>
        `;
      });

      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-10 glow-box">
          <div class="flex justify-between items-center mb-6">
            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase ${q.badgeClass}">${q.round}</span>
            <span class="arcade-font text-cyan-400 text-lg">Question ${currentQuestionIdx + 1} of ${roundQuestions.length}</span>
          </div>
          <h2 class="arcade-font text-2xl md:text-3xl text-white mb-8 leading-snug">${q.q}</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${optionsHtml}
          </div>
        </div>
      `;
    }

    function startTimer() {
      const display = document.getElementById('timer-display');
      display.innerText = timeLeft + 's';
      timerInterval = setInterval(() => {
        timeLeft--;
        display.innerText = timeLeft + 's';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleAnswer(-1); // Time out
        }
      }, 1000);
    }

    function handleAnswer(selectedIndex) {
      clearInterval(timerInterval);
      const q = roundQuestions[currentQuestionIdx];
      const isCorrect = (selectedIndex === q.correct);
      
      if (isCorrect) score += 10;
      updateScoreDisplay();

      const container = document.getElementById('app-container');
      if (isCorrect) {
        container.innerHTML = `
          <div class="bg-emerald-950/80 border-2 border-emerald-500 rounded-3xl p-10 text-center glow-correct">
            <div class="w-20 h-20 bg-emerald-500 text-slate-950 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg">
              <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="arcade-font text-4xl text-emerald-400 mb-3">CORRECT!</h2>
            <p class="text-emerald-200 text-lg mb-8">Fantastic job! You nailed that question.</p>
            <button onclick="nextQuestion()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 arcade-font text-xl px-8 py-3 rounded-xl font-bold shadow-lg transition">
              NEXT QUESTION <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="bg-red-950/80 border-2 border-red-500 rounded-3xl p-10 text-center glow-wrong">
            <div class="w-20 h-20 bg-red-500 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg">
              <i class="fa-solid fa-xmark"></i>
            </div>
            <h2 class="arcade-font text-4xl text-red-400 mb-3">INCORRECT!</h2>
            <p class="text-red-200 text-lg mb-8">The correct answer was: <strong>${q.options[q.correct]}</strong></p>
            <button onclick="nextQuestion()" class="bg-red-500 hover:bg-red-400 text-white arcade-font text-xl px-8 py-3 rounded-xl font-bold shadow-lg transition">
              CONTINUE <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        `;
      }
    }

    function nextQuestion() {
      currentQuestionIdx++;
      loadQuestion();
    }

    function showRoundComplete() {
      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-10 text-center glow-box">
          <div class="text-5xl text-amber-400 mb-4"><i class="fa-solid fa-trophy"></i></div>
          <h2 class="arcade-font text-4xl text-white mb-4">ROUND COMPLETED!</h2>
          <p class="text-slate-300 text-lg mb-8">You finished this round's questions. Total Score: <span class="text-emerald-400 font-bold">${score} pts</span></p>
          <div class="flex justify-center gap-4">
            <button onclick="returnToHub()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 arcade-font text-lg px-6 py-3 rounded-xl font-bold transition">
              <i class="fa-solid fa-house mr-2"></i> RETURN TO HUB
            </button>
          </div>
        </div>
      `;
    }

    function updateScoreDisplay() {
      document.getElementById('score-display').innerText = score + ' pts';
    }

    function returnToHub() {
      renderHub();
    }

    // Initialize Hub on load
    window.onload = renderHub;
  </script>
</body>
</html>
