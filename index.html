    function playSound(freq, duration, type='sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function playCorrectSound() {
      playSound(523.25, 0.15);
      setTimeout(() => playSound(659.25, 0.15), 120);

      { id: 96, round: "Round 5: Very Hard", points: 50, q: "Class of 80: 45 study Math, 38 CS, 20 both. How many study neither?", options: ["13", "17", "23", "27"], correct: 1 },
      { id: 97, round: "Round 5: Very Hard", points: 50, q: "6 distinct people in line. Arrangements where Alice & Bob stand together?", options: ["120", "240", "360", "720"], correct: 1 },
      { id: 98, round: "Round 5: Very Hard", points: 50, q: "5 red & 3 blue balls. 2 drawn without replacement. Probability both red?", options: ["5/16", "5/14", "25/64", "1/2"], correct: 1 },
      { id: 99, round: "Round 5: Very Hard", points: 50, q: "Let f(x) = 2x + 1 and g(x) = x². Find (g ∘ f)(3).", options: ["25", "36", "49", "64"], correct: 2 },
      { id: 100, round: "Round 5: Very Hard", points: 50, q: "What is an ordered pair?", options: ["Group without order", "Pair where position matters", "Set with no elements", "Factorial"], correct: 1 }
    ];

    // Screen 1: Cover / Start Screen
    function showCoverScreen() {
      document.getElementById('main-header').classList.add('hidden');
      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="text-center bg-slate-900/90 border border-slate-800 p-8 md:p-14 rounded-3xl glow-box max-w-3xl mx-auto">
          <div class="inline-block bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-4 py-1.5 rounded-full arcade-font text-sm mb-4">
            LIVE CLASSROOM GAME SHOW
          </div>
          <h1 class="arcade-font text-5xl md:text-6xl text-white mb-4 leading-tight">
            DISCRETE MATH<br><span class="text-cyan-400">TRIVIA SHOWDOWN</span>
          </h1>
          <p class="text-slate-400 text-lg mb-8">
            100 Questions • 5 Rounds of Difficulty • 3 Teams Battle
          </p>
          <div class="flex flex-col sm:flex-row justify-center gap-4">
            <button onclick="showInstructions()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 arcade-font text-xl px-8 py-4 rounded-2xl font-bold shadow-lg transition transform hover:-translate-y-1">
              <i class="fa-solid fa-play mr-2"></i> START GAME
            </button>
          </div>
        </div>
      `;
    }

    // Screen 2: Game Instructions Screen
    function showInstructions() {
      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 p-8 md:p-10 rounded-3xl glow-box max-w-3xl mx-auto">
          <div class="arcade-font text-3xl text-white mb-6 flex items-center gap-3 border-b border-slate-800 pb-4">
            <i class="fa-solid fa-clipboard-list text-cyan-400"></i> GAME INSTRUCTIONS & RULES
          </div>
          <ul class="space-y-4 text-slate-300 text-base mb-8">
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">1</span>
              <span><strong>3 Teams:</strong> Click on Team 1, Team 2, or Team 3 in the header to set who is currently taking their turn.</span>
            </li>
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">2</span>
              <span><strong>Jeopardy Board Selection:</strong> The active team chooses any question box from the grid.</span>
            </li>
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">3</span>
              <span><strong>No Repeat Questions:</strong> Once a question is answered, its button becomes grayed out and disabled!</span>
            </li>
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">4</span>
              <span><strong>Points System:</strong> Correct answers add points (10 to 50 pts based on difficulty) directly to the active team's score.</span>
            </li>
          </ul>
          <div class="text-center">
            <button onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 arcade-font text-xl px-10 py-4 rounded-2xl font-bold shadow-lg transition transform hover:-translate-y-1">
              ENTER GAME BOARD <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        </div>
      `;
    }

    function startGame() {
      document.getElementById('main-header').classList.remove('hidden');
      updateScoreboardUI();
      showBoard();
    }

    // Screen 3: Jeopardy Board Grid
    function showBoard() {
      const container = document.getElementById('app-container');
      
      const rounds = [
        { name: "Round 1: Very Easy", start: 0, end: 20, badge: "bg-emerald-600" },
        { name: "Round 2: Easy", start: 20, end: 40, badge: "bg-blue-600" },
        { name: "Round 3: Normal", start: 40, end: 65, badge: "bg-amber-600" },
        { name: "Round 4: Hard", start: 65, end: 85, badge: "bg-red-600" },
        { name: "Round 5: Very Hard", start: 85, end: 100, badge: "bg-purple-600" }
      ];

      let boardHtml = `
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl glow-box">
          <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-3">
            <h2 class="arcade-font text-2xl text-white">SELECT A QUESTION</h2>
            <div class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-xs text-slate-300">
              Active Turn: <strong class="text-${teams[activeTeamIndex].color}-400 uppercase">${teams[activeTeamIndex].name}</strong>
            </div>
          </div>
          <div class="space-y-6 max-h-[60vh] overflow-y-auto pr-2">
      `;

      rounds.forEach(r => {
        boardHtml += `
          <div>
            <div class="flex items-center gap-3 mb-3">
              <span class="${r.badge} text-white px-3 py-1 rounded-lg text-xs font-bold uppercase arcade-font">${r.name}</span>
            </div>
            <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
        `;
        for(let i = r.start; i < r.end; i++) {
          const q = allQuestions[i];
          const isAnswered = answeredQuestions.has(q.id);
          const disabledClass = isAnswered ? 'disabled-q' : 'hover:scale-105 border-slate-700 hover:border-cyan-400 bg-slate-800 text-cyan-400';
          boardHtml += `
            <button onclick="openQuestion(${i})" ${isAnswered ? 'disabled' : ''} class="p-3 rounded-xl border text-center font-bold text-sm transition arcade-font ${disabledClass}">
              ${q.id}
            </button>
          `;
        }
        boardHtml += `</div></div>`;
      });

      boardHtml += `</div></div>`;
      container.innerHTML = boardHtml;
    }

    // Screen 4: Active Question View
    function openQuestion(index) {
      currentQIndex = index;
      const q = allQuestions[index];
      const activeTeam = teams[activeTeamIndex];
      const container = document.getElementById('app-container');

      const letters = ['A', 'B', 'C', 'D'];
      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += `
          <button onclick="submitAnswer(${idx})" class="bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-cyan-400 p-4 rounded-xl flex items-center gap-4 text-left font-semibold text-base transition transform hover:-translate-y-0.5">
            <span class="arcade-font bg-cyan-400 text-slate-950 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-base shrink-0">${letters[idx]}</span>
            <span class="text-slate-100">${opt}</span>
          </button>
        `;
      });

      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-10 glow-box">
          <div class="flex justify-between items-center mb-6">
            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase bg-slate-800 text-cyan-400 border border-slate-700">${q.round} • ${q.points} pts</span>
            <span class="arcade-font text-${activeTeam.color}-400 text-base font-bold">${activeTeam.name}'s TURN</span>
          </div>
          <h2 class="arcade-font text-2xl md:text-3xl text-white mb-8 leading-snug">${q.q}</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${optionsHtml}
          </div>
        </div>
      `;
    }

    // Screen 5: Feedback & Score Update
    function submitAnswer(selectedIndex) {
      const q = allQuestions[currentQIndex];
      answeredQuestions.add(q.id);
      const isCorrect = (selectedIndex === q.correct);
      const activeTeam = teams[activeTeamIndex];

      if (isCorrect) {
        activeTeam.score += q.points;
        playCorrectSound();
      } else {
        playWrongSound();
      }
      updateScoreboardUI();

      const container = document.getElementById('app-container');
      if (isCorrect) {
        container.innerHTML = `
          <div class="bg-emerald-950/90 border-2 border-emerald-500 rounded-3xl p-8 md:p-12 text-center glow-correct max-w-2xl mx-auto">
            <div class="w-20 h-20 bg-emerald-500 text-slate-950 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">
              <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="arcade-font text-4xl text-emerald-400 mb-2">CORRECT!</h2>
            <p class="text-emerald-200 text-lg mb-6">${activeTeam.name} earned <strong class="text-white">+${q.points} points</strong>!</p>
            <button onclick="finishQuestionTurn()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 arcade-font text-xl px-8 py-3.5 rounded-xl font-bold shadow-lg transition">
              BACK TO GAME BOARD <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="bg-red-950/90 border-2 border-red-500 rounded-3xl p-8 md:p-12 text-center glow-wrong max-w-2xl mx-auto">
            <div class="w-20 h-20 bg-red-500 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">
              <i class="fa-solid fa-xmark"></i>
            </div>
            <h2 class="arcade-font text-4xl text-red-400 mb-2">INCORRECT!</h2>
            <p class="text-red-200 text-base mb-6">Correct Answer: <strong>${q.options[q.correct]}</strong></p>
            <button onclick="finishQuestionTurn()" class="bg-red-500 hover:bg-red-400 text-white arcade-font text-xl px-8 py-3.5 rounded-xl font-bold shadow-lg transition">
              BACK TO GAME BOARD <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        `;
      }
    }

    function finishQuestionTurn() {
      // Auto rotate turn to next team
      activeTeamIndex = (activeTeamIndex + 1) % teams.length;
      updateScoreboardUI();
      showBoard();
    }

    function selectActiveTeam(idx) {
      activeTeamIndex = idx;
      updateScoreboardUI();
    }

    function updateScoreboardUI() {
      document.getElementById('t1-score').innerText = `${teams[0].score} pts`;
      document.getElementById('t2-score').innerText = `${teams[1].score} pts`;
      document.getElementById('t3-score').innerText = `${teams[2].score} pts`;

      document.getElementById('t1-card').className = `cursor-pointer bg-slate-800 border-2 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px] ${activeTeamIndex === 0 ? 'border-emerald-400 bg-emerald-950/40' : 'border-slate-700 opacity-60'}`;
      document.getElementById('t2-card').className = `cursor-pointer bg-slate-800 border-2 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px] ${activeTeamIndex === 1 ? 'border-cyan-400 bg-cyan-950/40' : 'border-slate-700 opacity-60'}`;
      document.getElementById('t3-card').className = `cursor-pointer bg-slate-800 border-2 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px] ${activeTeamIndex === 2 ? 'border-purple-400 bg-purple-950/40' : 'border-slate-700 opacity-60'}`;
    }

    // Initialize Cover Screen on Load
    window.onload = showCoverScreen;
  </script>
</body>
</html>
