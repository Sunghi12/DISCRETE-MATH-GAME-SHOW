<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discrete Math Game Show - Multi-Team Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #090d16; color: #f8fafc; overflow-x: hidden; }
    .arcade-font { font-family: 'Fredoka', sans-serif; }
    .glow-box { box-shadow: 0 0 35px rgba(56, 189, 248, 0.15); }
    .glow-correct { box-shadow: 0 0 45px rgba(16, 185, 129, 0.4); }
    .glow-wrong { box-shadow: 0 0 45px rgba(239, 68, 68, 0.4); }
    .disabled-q { opacity: 0.35; cursor: not-allowed !important; pointer-events: none; filter: grayscale(1); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6">

  <!-- Header & Team Scoreboard -->
  <header id="main-header" class="max-w-6xl mx-auto w-full hidden flex-col md:flex-row justify-between items-center bg-slate-900/90 border border-slate-800 p-4 md:px-6 rounded-2xl shadow-xl gap-4 mb-4">
    <div class="flex items-center gap-3">
      <div class="bg-cyan-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl arcade-font text-lg flex items-center gap-2">
        <i class="fa-solid fa-gamepad"></i> DISCRETE MATH
      </div>
      <button onclick="toggleBgm()" id="bgm-btn" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-2 border border-slate-700 transition">
        <i class="fa-solid fa-music"></i> Audio: OFF
      </button>
    </div>

    <!-- 3 Teams Scoreboard -->
    <div class="flex items-center gap-3 w-full md:w-auto justify-center">
      <!-- Team 1 -->
      <div id="t1-card" onclick="selectActiveTeam(0)" class="cursor-pointer bg-slate-800 border-2 border-emerald-500/50 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px]">
        <div class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">TEAM 1</div>
        <div id="t1-score" class="arcade-font text-lg text-white">0 pts</div>
      </div>
      <!-- Team 2 -->
      <div id="t2-card" onclick="selectActiveTeam(1)" class="cursor-pointer bg-slate-800 border-2 border-cyan-500/50 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px]">
        <div class="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">TEAM 2</div>
        <div id="t2-score" class="arcade-font text-lg text-white">0 pts</div>
      </div>
      <!-- Team 3 -->
      <div id="t3-card" onclick="selectActiveTeam(2)" class="cursor-pointer bg-slate-800 border-2 border-purple-500/50 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px]">
        <div class="text-[10px] text-purple-400 font-bold uppercase tracking-wider">TEAM 3</div>
        <div id="t3-score" class="arcade-font text-lg text-white">0 pts</div>
      </div>
    </div>

    <!-- Timer Box Header Display -->
    <div id="timer-display-box" class="hidden items-center gap-2 bg-slate-800 border border-slate-700 px-4 py-1.5 rounded-xl text-amber-400 font-bold arcade-font text-lg">
      <i class="fa-solid fa-stopwatch animate-pulse"></i>
      <span id="timer-text">0s</span>
    </div>

    <button onclick="showBoard()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl font-bold text-xs transition border border-slate-700">
      <i class="fa-solid fa-grid-2"></i> Board
    </button>
  </header>

  <!-- App Main Screen Area -->
  <main id="app-container" class="max-w-6xl mx-auto w-full flex-grow flex flex-col justify-center">
    <!-- Screen content dynamically loaded -->
  </main>

  <footer class="max-w-6xl mx-auto w-full text-center text-xs text-slate-500 mt-4">
    Discrete Mathematics Game Show • 3 Teams Interactive Competition • 100 Questions
  </footer>

  <script>
    // Audio synthesizer for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgmInterval = null;
    let bgmOn = false;

    function playSound(freq, duration, type='sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function playCorrectSound() {
      playSound(523.25, 0.15);
      setTimeout(() => playSound(659.25, 0.15), 120);
      setTimeout(() => playSound(783.99, 0.3), 240);
    }

    function playWrongSound() {
      playSound(200, 0.2, 'sawtooth');
      setTimeout(() => playSound(150, 0.3, 'sawtooth'), 200);
    }

    function toggleBgm() {
      bgmOn = !bgmOn;
      const btn = document.getElementById('bgm-btn');
      if (bgmOn) {
        btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Audio: ON';
        btn.classList.replace('text-amber-400', 'text-emerald-400');
        playBgmLoop();
      } else {
        btn.innerHTML = '<i class="fa-solid fa-music"></i> Audio: OFF';
        btn.classList.replace('text-emerald-400', 'text-amber-400');
        clearInterval(bgmInterval);
      }
    }

    function playBgmLoop() {
      const notes = [261.63, 329.63, 392.00, 523.25];
      let step = 0;
      bgmInterval = setInterval(() => {
        if (!bgmOn) return;
        playSound(notes[step % notes.length], 0.1);
        step++;
      }, 400);
    }

    // Game State
    let teams = [
      { name: "Team 1", score: 0, color: "emerald" },
      { name: "Team 2", score: 0, color: "cyan" },
      { name: "Team 3", score: 0, color: "purple" }
    ];
    let activeTeamIndex = 0;
    let answeredQuestions = new Set();
    let currentQIndex = null;
    let timerInterval = null;
    let timeLeft = 0;

    // Difficulty Timer Rules (in seconds)
    function getRoundTimeLimit(roundName) {
      if (roundName.includes("Very Easy")) return 10;
      if (roundName.includes("Easy")) return 20;
      if (roundName.includes("Normal")) return 30;
      if (roundName.includes("Hard") && !roundName.includes("Very Hard")) return 40;
      if (roundName.includes("Very Hard")) return 60;
      return 30;
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timeLeft = seconds;
      const timerBox = document.getElementById('timer-display-box');
      const timerText = document.getElementById('timer-text');
      const timerBar = document.getElementById('timer-bar');
      
      timerBox.classList.remove('hidden');
      timerBox.classList.add('flex');
      timerText.innerText = `${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        if (timerText) timerText.innerText = `${timeLeft}s`;
        if (timerBar) timerBar.style.width = `${(timeLeft / seconds) * 100}%`;

        if (timeLeft <= 3 && timeLeft > 0) {
          playSound(800, 0.08, 'square');
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      const timerBox = document.getElementById('timer-display-box');
      if (timerBox) {
        timerBox.classList.remove('flex');
        timerBox.classList.add('hidden');
      }
    }

    function handleTimeOut() {
      stopTimer();
      playWrongSound();
      const q = allQuestions[currentQIndex];
      answeredQuestions.add(q.id);
      const activeTeam = teams[activeTeamIndex];

      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="bg-amber-950/90 border-2 border-amber-500 rounded-3xl p-8 md:p-12 text-center glow-wrong max-w-2xl mx-auto">
          <div class="w-20 h-20 bg-amber-500 text-slate-950 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg animate-bounce">
            <i class="fa-solid fa-hourglass-end"></i>
          </div>
          <h2 class="arcade-font text-4xl text-amber-400 mb-2">TIME'S UP!</h2>
          <p class="text-amber-200 text-base mb-6">${activeTeam.name} ran out of time. Correct Answer: <strong>${q.options[q.correct]}</strong></p>
          <button onclick="finishQuestionTurn()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 arcade-font text-xl px-8 py-3.5 rounded-xl font-bold shadow-lg transition">
            BACK TO GAME BOARD <i class="fa-solid fa-arrow-right ml-2"></i>
          </button>
        </div>
      `;
    }

    // Screen 2: Game Instructions Screen
    function showInstructions() {
      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 p-8 md:p-10 rounded-3xl glow-box max-w-3xl mx-auto">
          <div class="arcade-font text-3xl text-white mb-6 flex items-center gap-3 border-b border-slate-800 pb-4">
            <i class="fa-solid fa-clipboard-list text-cyan-400"></i> GAME INSTRUCTIONS & RULES
          </div>
          <ul class="space-y-4 text-slate-300 text-base mb-8">
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">1</span>
              <span><strong>3 Teams:</strong> Click on Team 1, Team 2, or Team 3 in the header to set who is currently taking their turn.</span>
            </li>
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">2</span>
              <span><strong>Jeopardy Board Selection:</strong> The active team chooses any question box from the grid.</span>
            </li>
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">3</span>
              <span><strong>No Repeat Questions:</strong> Once a question is answered, its button becomes grayed out and disabled!</span>
            </li>
            <li class="flex items-start gap-3">
              <span class="bg-cyan-500 text-slate-950 font-bold rounded-lg w-6 h-6 flex items-center justify-center shrink-0 mt-0.5">4</span>
              <span><strong>Points System:</strong> Correct answers add points (10 to 50 pts based on difficulty) directly to the active team's score.</span>
            </li>
          </ul>
          <div class="text-center">
            <button onclick="startGame()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 arcade-font text-xl px-10 py-4 rounded-2xl font-bold shadow-lg transition transform hover:-translate-y-1">
              ENTER GAME BOARD <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        </div>
      `;
    }

    function startGame() {
      document.getElementById('main-header').classList.remove('hidden');
      updateScoreboardUI();
      showBoard();
    }

    // Screen 3: Jeopardy Board Grid
    function showBoard() {
      stopTimer();
      const container = document.getElementById('app-container');
      
      const rounds = [
        { name: "Round 1: Very Easy", start: 0, end: 20, badge: "bg-emerald-600" },
        { name: "Round 2: Easy", start: 20, end: 40, badge: "bg-blue-600" },
        { name: "Round 3: Normal", start: 40, end: 65, badge: "bg-amber-600" },
        { name: "Round 4: Hard", start: 65, end: 85, badge: "bg-red-600" },
        { name: "Round 5: Very Hard", start: 85, end: 100, badge: "bg-purple-600" }
      ];

      let boardHtml = `
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl glow-box">
          <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-3">
            <h2 class="arcade-font text-2xl text-white">SELECT A QUESTION</h2>
            <div class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-xs text-slate-300">
              Active Turn: <strong class="text-${teams[activeTeamIndex].color}-400 uppercase">${teams[activeTeamIndex].name}</strong>
            </div>
          </div>
          <div class="space-y-6 max-h-[60vh] overflow-y-auto pr-2">
      `;

      rounds.forEach(r => {
        boardHtml += `
          <div>
            <div class="flex items-center gap-3 mb-3">
              <span class="${r.badge} text-white px-3 py-1 rounded-lg text-xs font-bold uppercase arcade-font">${r.name}</span>
            </div>
            <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
        `;
        for(let i = r.start; i < r.end; i++) {
          const q = allQuestions[i];
          const isAnswered = answeredQuestions.has(q.id);
          const disabledClass = isAnswered ? 'disabled-q' : 'hover:scale-105 border-slate-700 hover:border-cyan-400 bg-slate-800 text-cyan-400';
          boardHtml += `
            <button onclick="openQuestion(${i})" ${isAnswered ? 'disabled' : ''} class="p-3 rounded-xl border text-center font-bold text-sm transition arcade-font ${disabledClass}">
              ${q.id}
            </button>
          `;
        }
        boardHtml += `</div></div>`;
      });

      boardHtml += `</div></div>`;
      container.innerHTML = boardHtml;
    }

    // Screen 4: Active Question View
    function openQuestion(index) {
      currentQIndex = index;
      const q = allQuestions[index];
      const activeTeam = teams[activeTeamIndex];
      const timeLimit = getRoundTimeLimit(q.round);
      const container = document.getElementById('app-container');

      const letters = ['A', 'B', 'C', 'D'];
      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += `
          <button onclick="submitAnswer(${idx})" class="bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-cyan-400 p-4 rounded-xl flex items-center gap-4 text-left font-semibold text-base transition transform hover:-translate-y-0.5">
            <span class="arcade-font bg-cyan-400 text-slate-950 w-8 h-8 rounded-lg flex items-center justify-center font-bold text-base shrink-0">${letters[idx]}</span>
            <span class="text-slate-100">${opt}</span>
          </button>
        `;
      });

      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-10 glow-box">
          <div class="flex justify-between items-center mb-4">
            <span class="px-3 py-1 rounded-full text-xs font-bold uppercase bg-slate-800 text-cyan-400 border border-slate-700">${q.round} • ${q.points} pts • ${timeLimit}s Timer</span>
            <span class="arcade-font text-${activeTeam.color}-400 text-base font-bold">${activeTeam.name}'s TURN</span>
          </div>

          <!-- Countdown Progress Bar -->
          <div class="w-full bg-slate-800 h-3 rounded-full mb-6 overflow-hidden border border-slate-700">
            <div id="timer-bar" class="bg-amber-400 h-full w-full transition-all duration-1000 ease-linear"></div>
          </div>

          <h2 class="arcade-font text-2xl md:text-3xl text-white mb-8 leading-snug">${q.q}</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${optionsHtml}
          </div>
        </div>
      `;

      startTimer(timeLimit);
    }

    // Screen 5: Feedback & Score Update
    function submitAnswer(selectedIndex) {
      stopTimer();
      const q = allQuestions[currentQIndex];
      answeredQuestions.add(q.id);
      const isCorrect = (selectedIndex === q.correct);
      const activeTeam = teams[activeTeamIndex];

      if (isCorrect) {
        activeTeam.score += q.points;
        playCorrectSound();
      } else {
        playWrongSound();
      }
      updateScoreboardUI();

      const container = document.getElementById('app-container');
      if (isCorrect) {
        container.innerHTML = `
          <div class="bg-emerald-950/90 border-2 border-emerald-500 rounded-3xl p-8 md:p-12 text-center glow-correct max-w-2xl mx-auto">
            <div class="w-20 h-20 bg-emerald-500 text-slate-950 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">
              <i class="fa-solid fa-check"></i>
            </div>
            <h2 class="arcade-font text-4xl text-emerald-400 mb-2">CORRECT!</h2>
            <p class="text-emerald-200 text-lg mb-6">${activeTeam.name} earned <strong class="text-white">+${q.points} points</strong>!</p>
            <button onclick="finishQuestionTurn()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 arcade-font text-xl px-8 py-3.5 rounded-xl font-bold shadow-lg transition">
              BACK TO GAME BOARD <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="bg-red-950/90 border-2 border-red-500 rounded-3xl p-8 md:p-12 text-center glow-wrong max-w-2xl mx-auto">
            <div class="w-20 h-20 bg-red-500 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">
              <i class="fa-solid fa-xmark"></i>
            </div>
            <h2 class="arcade-font text-4xl text-red-400 mb-2">INCORRECT!</h2>
            <p class="text-red-200 text-base mb-6">Correct Answer: <strong>${q.options[q.correct]}</strong></p>
            <button onclick="finishQuestionTurn()" class="bg-red-500 hover:bg-red-400 text-white arcade-font text-xl px-8 py-3.5 rounded-xl font-bold shadow-lg transition">
              BACK TO GAME BOARD <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        `;
      }
    }

    function finishQuestionTurn() {
      // Auto rotate turn to next team
      activeTeamIndex = (activeTeamIndex + 1) % teams.length;
      updateScoreboardUI();
      showBoard();
    }

    function selectActiveTeam(idx) {
      activeTeamIndex = idx;
      updateScoreboardUI();
    }

    function updateScoreboardUI() {
      document.getElementById('t1-score').innerText = `${teams[0].score} pts`;
      document.getElementById('t2-score').innerText = `${teams[1].score} pts`;
      document.getElementById('t3-score').innerText = `${teams[2].score} pts`;

      document.getElementById('t1-card').className = `cursor-pointer bg-slate-800 border-2 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px] ${activeTeamIndex === 0 ? 'border-emerald-400 bg-emerald-950/40' : 'border-slate-700 opacity-60'}`;
      document.getElementById('t2-card').className = `cursor-pointer bg-slate-800 border-2 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px] ${activeTeamIndex === 1 ? 'border-cyan-400 bg-cyan-950/40' : 'border-slate-700 opacity-60'}`;
      document.getElementById('t3-card').className = `cursor-pointer bg-slate-800 border-2 p-2 px-4 rounded-xl text-center transition hover:scale-105 min-w-[110px] ${activeTeamIndex === 2 ? 'border-purple-400 bg-purple-950/40' : 'border-slate-700 opacity-60'}`;
    }

    // Cover Screen View
    function showCoverScreen() {
      stopTimer();
      document.getElementById('main-header').classList.add('hidden');
      const container = document.getElementById('app-container');
      container.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 p-8 md:p-14 rounded-3xl glow-box text-center max-w-3xl mx-auto my-auto">
          <div class="inline-flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-bold px-4 py-1.5 rounded-full text-xs uppercase tracking-widest mb-6 arcade-font">
            <i class="fa-solid fa-trophy"></i> Ultimate Classroom Showdown
          </div>
          <h1 class="arcade-font text-4xl md:text-6xl text-white mb-4 leading-tight">
            DISCRETE MATH<br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">GAME SHOW</span>
          </h1>
          <p class="text-slate-400 text-base md:text-lg mb-8 max-w-xl mx-auto">
            100 Questions • 5 Round Difficulties • 3-Team Multiplayer Battle Mode
          </p>
          <button onclick="showInstructions()" class="bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-slate-950 arcade-font text-2xl px-12 py-4 rounded-2xl font-bold shadow-2xl transition transform hover:scale-105">
            START GAME <i class="fa-solid fa-play ml-2"></i>
          </button>
        </div>
      `;
    }

    // Complete Questions Dataset (Q1 to Q100)
    const allQuestions = [
      // Round 1 - Very Easy (10 pts)
      { id: 1, round: "Round 1: Very Easy", points: 10, q: "A statement that is either true or false but not both is called a _____.", options: ["Variable", "Proposition", "Equation", "Expression"], correct: 1 },
      { id: 2, round: "Round 1: Very Easy", points: 10, q: "What is the truth value of the statement: 'The sun rises in the east'?", options: ["True", "False", "Both true and false", "Cannot be determined"], correct: 0 },
      { id: 3, round: "Round 1: Very Easy", points: 10, q: "The symbol ∧ represents _____.", options: ["OR", "NOT", "AND", "IF THEN"], correct: 2 },
      { id: 4, round: "Round 1: Very Easy", points: 10, q: "The symbol ∨ represents _____.", options: ["AND", "OR", "NOT", "Equivalent"], correct: 1 },
      { id: 5, round: "Round 1: Very Easy", points: 10, q: "The negation of 'Today is Monday' is:", options: ["Today is Tuesday", "Today is not Monday", "Tomorrow is Monday", "Today is Sunday"], correct: 1 },
      { id: 6, round: "Round 1: Very Easy", points: 10, q: "If p is true, what is the truth value of ¬p?", options: ["True", "False", "Both", "Unknown"], correct: 1 },
      { id: 7, round: "Round 1: Very Easy", points: 10, q: "A compound proposition is formed by combining:", options: ["Numbers", "Variables", "Simple propositions", "Sets"], correct: 2 },
      { id: 8, round: "Round 1: Very Easy", points: 10, q: "A collection of well-defined objects is called a _____.", options: ["Function", "Set", "Relation", "Graph"], correct: 1 },
      { id: 9, round: "Round 1: Very Easy", points: 10, q: "Which logical operator is represented by the symbol ↔?", options: ["Implication", "Biconditional", "Negation", "Conjunction"], correct: 1 },
      { id: 10, round: "Round 1: Very Easy", points: 10, q: "What are the two possible values in Boolean Algebra?", options: ["1 and 2", "−1 and 1", "0 and 2", "0 and 1"], correct: 3 },
      { id: 11, round: "Round 1: Very Easy", points: 10, q: "What is the Boolean result of 1 AND 1?", options: ["1", "0", "2", "Undefined"], correct: 0 },
      { id: 12, round: "Round 1: Very Easy", points: 10, q: "What is the Boolean result of 0 OR 1?", options: ["0", "2", "1", "Undefined"], correct: 2 },
      { id: 13, round: "Round 1: Very Easy", points: 10, q: "What is the Boolean result of NOT 0?", options: ["0", "−1", "2", "1"], correct: 3 },
      { id: 14, round: "Round 1: Very Easy", points: 10, q: "Which of the following is an example of a finite set?", options: ["The set of all natural numbers", "The set of months in a year", "The set of all integers", "The set of all real numbers"], correct: 1 },
      { id: 15, round: "Round 1: Very Easy", points: 10, q: "If A = {2, 4, 8}, which number is NOT an element of A?", options: ["2", "4", "5", "8"], correct: 2 },
